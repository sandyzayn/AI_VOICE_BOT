apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-app
  labels:
    app: voice-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-app
  template:
    metadata:
      labels:
        app: voice-app
    spec:
      containers:
      - name: voice-app
        image: voice-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80    # ← Nginx uses port 80, not 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80          # ← Change to 80
          initialDelaySeconds: 10  # ← Increase delay for nginx startup
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80          # ← Change to 80
          initialDelaySeconds: 10  # ← Increase delay for nginx startup
          periodSeconds: 10